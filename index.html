<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Week.world - Mobile</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{margin:0;font-family:'Segoe UI',Arial;overflow:hidden; background: #000; touch-action: none;}
#map{height:100vh; width: 100vw; cursor:crosshair;}

/* ANA MENÜ VE MEYDAN OKUMA MENÜSÜ */
#main-menu, #challenge-menu {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100vh;
    background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.9)), url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1920&q=80') center/cover;
    backdrop-filter: blur(10px);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: opacity 0.5s ease;
    overflow-y: auto;
    padding: 20px 0;
}

#challenge-menu { 
    display: none; 
    background: radial-gradient(circle, rgba(20,30,48,1) 0%, rgba(5,5,5,1) 100%);
    z-index: 10002;
}

.mode-card h3 { color: white; margin: 10px 0 0 0; font-size: 16px; }
.mode-desc-mobile { font-size: 11px; color: #ffcc00; opacity: 0.8; text-align: center; margin-top: 4px; padding: 0 10px;}

/* PANELLER */
#playtime-container, #medal-container-mobile {
    position: fixed; top: 15px; left: 15px;
    background: rgba(20, 25, 35, 0.85); padding: 10px 15px;
    border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1);
    z-index: 10001; color: white; backdrop-filter: blur(8px);
}
#medal-container-mobile { display: none; z-index: 10003; }

#rank-container {
    position: fixed; top: 15px; right: 15px;
    background: rgba(20, 25, 35, 0.85); padding: 12px;
    border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1);
    z-index: 10001; color: white; min-width: 150px; backdrop-filter: blur(8px);
}

.rank-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
#rank-emoji { font-size: 24px; }
.rank-label { font-size: 9px; text-transform: uppercase; color: #9da3af; font-weight: 800; }
#rank-name { font-size: 14px; font-weight: bold; }

.win-bar { height: 8px; background: rgba(255, 255, 255, 0.05); border-radius: 4px; display: flex; gap: 2px; }
.tick { flex: 1; background: rgba(255, 255, 255, 0.1); border-radius: 1px; }
.tick.active { background: #ffcc00; }

/* MOD KARTLARI */
.modes-container { display: flex; gap: 12px; flex-direction: column; align-items: center; width: 100%; margin-top: 20px; }
.mode-card { 
    width: 85vw; height: 90px; 
    background: rgba(255, 255, 255, 0.05); 
    border: 1px solid rgba(255, 255, 255, 0.1); 
    border-radius: 16px; display: flex; align-items: center; padding: 0 20px; gap: 15px;
}
.mode-icon { font-size: 30px; }

/* OYUN UI */
.top-bar{ position:absolute;top:10px;left:0;width:100%; display:flex; flex-direction: column; align-items:center; gap: 5px; z-index:1000; pointer-events:none; visibility: hidden; }
.city-box{background:#ffcc00;padding:8px 15px;border-radius:10px;font-weight:bold;pointer-events:auto; font-size: 14px; color: black;}
.score-box{background:#00c853;color:white;padding:5px 15px;border-radius:10px;font-weight:bold;pointer-events:auto;}
.timer-box{ position:absolute; bottom: 100px; left:50%; transform:translateX(-50%); background:#ff3d00;color:white;padding:10px 20px;border-radius:20px; font-size:18px;font-weight:bold;z-index:1000; visibility: hidden;}
.bottom-bar{ position:absolute;bottom:30px;left:50%;transform:translateX(-50%); z-index:1000; width: 90%; text-align: center; visibility: hidden;}
button.guess-btn { width: 80%; max-width: 300px; padding:15px; font-size:18px; border:none; border-radius:30px; background:#2962ff; color:white; font-weight:bold; }
.distance-box{ position:absolute; top: 120px; left:50%; transform:translateX(-50%); background:#2962ff; color:white; padding:8px 20px; border-radius:20px; font-weight:bold; z-index:1000; display:none; font-size: 12px; }
.result-box{ position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:25px; border-radius:20px; z-index:10005; display:none; width:85%; text-align: center; color: black; }

.back-btn-mobile {
    margin-top: 30px; padding: 12px 40px; background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 10px; font-weight: bold;
}
</style>
</head>
<body>

<div id="playtime-container">
    <div class="playtime-label">SÜRE</div>
    <div id="playtime-display">0s 0dk</div>
</div>

<div id="medal-container-mobile">
    <div class="rank-label">MADALYALAR</div>
    <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:20px;">🏆</span>
        <span id="medal-count" style="font-size:18px; font-weight:bold; color:#ffcc00;">0</span>
    </div>
</div>

<div id="rank-container">
    <div class="rank-header">
        <div id="rank-emoji">⛓️</div>
        <div class="rank-info">
            <div class="rank-label">Rütbe</div>
            <div id="rank-name">Demir</div>
        </div>
    </div>
    <div class="win-bar" id="win-ticks"></div>
</div>

<div id="main-menu">
    <h1 style="font-size:3rem; color:white; margin:0;">Week.world</h1>
    <div class="modes-container">
        <div class="mode-card" onclick="startGame('normal')"><span class="mode-icon">🌍</span><h3>Dünya</h3></div>
        <div class="mode-card" onclick="startGame('speedrun')"><span class="mode-icon">⏱️</span><h3>Speedrun</h3></div>
        <div class="mode-card" onclick="startGame('hardcore')"><span class="mode-icon">🧭</span><h3>Hardcore</h3></div>
        <div class="mode-card" onclick="openChallenges()" style="border-color: #ffcc00;"><span class="mode-icon">📚</span><h3>Meydan Okuma</h3></div>
    </div>
</div>

<div id="challenge-menu">
    <h2 style="color:white; margin:0;">Meydan Okumalar</h2>
    <p style="color:#aaa; font-size:12px; margin-bottom:20px;">(kazandıkça madalya kazanırsınız)</p>
    <div class="modes-container">
        <div class="mode-card" onclick="startGame('total_time')">
            <span class="mode-icon">⏳</span>
            <div style="display:flex; flex-direction:column;">
                <h3 style="margin:0;">Toplam Süre</h3>
                <span style="font-size:10px; color:#ffcc00;">5 Dakika Sınırı</span>
            </div>
        </div>
        <div class="mode-card" onclick="startGame('blind_shot')">
            <span class="mode-icon">🌑</span>
            <div style="display:flex; flex-direction:column;">
                <h3 style="margin:0;">Kör Atış</h3>
                <span style="font-size:10px; color:#ffcc00;">İsimsiz Harita / 500km</span>
            </div>
        </div>
    </div>
    <button class="back-btn-mobile" onclick="closeChallenges()">GERİ DÖN</button>
</div>

<div class="top-bar" id="game-ui-top">
    <div class="city-box"><span id="cityName">Yükleniyor...</span></div>
    <div class="score-box">Puan: <span id="score">0</span></div>
</div>

<div class="timer-box" id="timer">02:00</div>
<div class="distance-box" id="distanceBox"></div>

<div class="bottom-bar" id="game-ui-bottom">
    <button class="guess-btn" id="guessBtn" onclick="makeGuess()">TAHMİN ET</button>
</div>

<div class="result-box" id="result"></div>
<div id="map"></div>

<script>
let wins = parseInt(localStorage.getItem('weekWorldWins')) || 0;
let medals = parseInt(localStorage.getItem('weekWorldMedals')) || 0;
let totalSeconds = parseInt(localStorage.getItem('weekWorldPlaytime')) || 0;

setInterval(() => {
    totalSeconds++;
    localStorage.setItem('weekWorldPlaytime', totalSeconds);
    let hours = Math.floor(totalSeconds / 3600);
    let minutes = Math.floor((totalSeconds % 3600) / 60);
    document.getElementById('playtime-display').innerText = `${hours}s ${minutes}dk`;
}, 1000);

function openChallenges() {
    document.getElementById('challenge-menu').style.display = 'flex';
    document.getElementById('playtime-container').style.display = 'none';
    document.getElementById('medal-container-mobile').style.display = 'block';
    document.getElementById('medal-count').innerText = medals;
    setTimeout(() => document.getElementById('challenge-menu').style.opacity = '1', 10);
}

function closeChallenges() {
    document.getElementById('challenge-menu').style.opacity = '0';
    document.getElementById('playtime-container').style.display = 'block';
    document.getElementById('medal-container-mobile').style.display = 'none';
    setTimeout(() => document.getElementById('challenge-menu').style.display = 'none', 500);
}

function updateRankUI() {
    const ticksContainer = document.getElementById('win-ticks');
    const nameDiv = document.getElementById('rank-name');
    const emojiDiv = document.getElementById('rank-emoji');
    let emoji, name;
    if (wins < 20) { emoji = "⛓️"; name = "Demir"; }
    else if (wins < 40) { emoji = "🥈"; name = "Gümüş"; }
    else if (wins < 60) { emoji = "🥇"; name = "Altın"; }
    else if (wins < 80) { emoji = "💎"; name = "Elmas"; }
    else { emoji = "👑"; name = "Efsane"; }
    emojiDiv.innerText = emoji; nameDiv.innerText = name;
    ticksContainer.innerHTML = '';
    for (let i = 0; i < 20; i++) {
        const tick = document.createElement('div');
        tick.className = 'tick' + (i < (wins % 20) ? ' active' : '');
        ticksContainer.appendChild(tick);
    }
}

var cities = [["İstanbul",41.00,28.97],["Ankara",39.93,32.85],["İzmir",38.41,27.12],["Antalya",36.89,30.71],["Londra",51.50,-0.12],["Paris",48.85,2.35],["Berlin",52.52,13.40],["Roma",41.90,12.49],["Tokyo",35.67,139.65],["New York",40.71,-74.00],["Rio de Janeiro",-22.90,-43.17],["Sidney",-33.86,151.20]];

var map = L.map('map', {zoomControl: false, attributionControl: false, tap: true}).setView([20,0],2);
var baseLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
var blindLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png');

var selectedCity, lastCityIndex=-1, guessMarker=null, realMarker=null, line=null;
var score=0, timerInterval, nextRoundInterval, timeLeft=120, roundActive=false, currentMode='normal';

function startGame(mode) {
    currentMode = mode; score = 0;
    document.getElementById("score").innerText = "0";
    document.getElementById('main-menu').style.display = 'none';
    document.getElementById('challenge-menu').style.display = 'none';
    document.getElementById('rank-container').style.display = 'none';
    document.getElementById('playtime-container').style.display = 'none';
    document.getElementById('medal-container-mobile').style.display = 'none';
    
    document.getElementById('game-ui-top').style.visibility = 'visible';
    document.getElementById('game-ui-bottom').style.visibility = 'visible';
    document.getElementById('timer').style.visibility = 'visible';

    if(mode === 'blind_shot') { map.removeLayer(baseLayer); blindLayer.addTo(map); }
    else { map.removeLayer(blindLayer); baseLayer.addTo(map); }
    
    if(mode === 'total_time') timeLeft = 300;
    
    setTimeout(() => { map.invalidateSize(); startRound(); }, 600);
}

function startRound(){
    if(score >= 25000) { showFinalScreen(); return; }
    if(guessMarker) map.removeLayer(guessMarker);
    if(realMarker) map.removeLayer(realMarker);
    if(line) map.removeLayer(line);
    document.getElementById("distanceBox").style.display="none";
    document.getElementById("guessBtn").style.display="inline-block";
    
    if(currentMode !== 'total_time') {
        timeLeft = (currentMode === 'speedrun') ? 60 : (currentMode === 'blind_shot' ? 180 : 120);
    }
    
    document.getElementById("timer").style.display = (currentMode === 'hardcore') ? "none" : "block";
    
    let index;
    do{ index=Math.floor(Math.random()*cities.length); }while(index===lastCityIndex);
    lastCityIndex=index;
    selectedCity=cities[index];
    document.getElementById("cityName").innerText = selectedCity[0];
    roundActive=true;

    clearInterval(timerInterval);
    if(currentMode !== 'hardcore') {
        timerInterval=setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            if(timeLeft<=0){ clearInterval(timerInterval); gameOver("Süre Bitti!"); }
        },1000);
    }
}

function updateTimerDisplay(){
    let m=String(Math.floor(Math.max(0,timeLeft)/60)).padStart(2,'0');
    let s=String(Math.max(0,timeLeft)%60).padStart(2,'0');
    document.getElementById("timer").innerText=m+":"+s;
}

map.on("click", (e) => {
    if(!roundActive) return;
    if(guessMarker) map.removeLayer(guessMarker);
    guessMarker=L.marker(e.latlng).addTo(map);
});

function makeGuess(){
    if(!roundActive || !guessMarker) return;
    clearInterval(timerInterval);
    roundActive=false;
    document.getElementById("guessBtn").style.display="none";
    
    let realLatLng=L.latLng(selectedCity[1],selectedCity[2]);
    realMarker=L.marker(realLatLng).addTo(map);
    let guessLatLng=guessMarker.getLatLng();
    line=L.polyline([guessLatLng,realLatLng],{color:'red',weight:3}).addTo(map);
    
    let dist=map.distance(guessLatLng,realLatLng)/1000;
    if((currentMode === 'hardcore' || currentMode === 'blind_shot') && dist > 500) { 
        gameOver(currentMode === 'blind_shot' ? "500km sınırı aşıldı!" : "Kayıp!"); return; 
    }

    let roundScore=Math.max(0,Math.floor(5000-dist*5));
    score+=roundScore;
    document.getElementById("score").innerText=score;
    document.getElementById("distanceBox").innerText=Math.round(dist)+" km mesafe. +"+roundScore;
    document.getElementById("distanceBox").style.display="block";

    setTimeout(() => {
        if(score >= 25000) showFinalScreen();
        else {
            let countdown = 5;
            let originalTime = timeLeft;
            let cdInterval = setInterval(() => {
                document.getElementById("timer").innerText = "Mola: " + countdown;
                countdown--;
                if(countdown < 0) { 
                    clearInterval(cdInterval); 
                    if(currentMode === 'total_time') timeLeft = originalTime;
                    startRound(); 
                }
            }, 1000);
        }
    }, 2000);
}

function gameOver(msg) {
    document.getElementById("result").style.display="block";
    document.getElementById("result").innerHTML = `<h2>OYUN BİTTİ</h2><p>${msg}</p><button onclick="location.reload()" class="guess-btn">LOBİ</button>`;
}

function showFinalScreen(){
    wins++; localStorage.setItem('weekWorldWins', wins);
    if(currentMode === 'blind_shot' || currentMode === 'total_time') {
        medals++; localStorage.setItem('weekWorldMedals', medals);
    }
    document.getElementById("result").style.display="block";
    document.getElementById("result").innerHTML = `<h2 style="color:green">BAŞARDIN!</h2><p>Galibiyet ve Madalya!</p><button onclick="location.reload()" class="guess-btn">LOBİ</button>`;
}

updateRankUI();
</script>
</body>
</html>
